<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Currency Converter</title>
        <link rel="stylesheet" href="style1.css">
    </head>
    <body>
        <div id="div1" class="container">
            <h1>Currency Converter</h1>
            <form id="converter-form" class="converter-form">
                <div class="amount-row">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter amount" required>
                </div>

                <div class="currency-select" id="selector">
                    <label for="from-currency">From</label>
                    <div class="currency-box">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="USA Flag">
                        <select id="from-currency" class="from-currency" name="from-currency" required>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="PKR">PKR</option>
                        </select>
                    </div>
                </div>

                <div class="currency-select" id="selector2">
                    <label for="to-currency">To</label>
                    <div class="currency-box">
                        <img src="https://flagsapi.com/PK/flat/64.png" alt="Pakistan Flag">
                        <select id="to-currency" class="to-currency" name="to-currency" required>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="PKR">PKR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                </div>

                <button id="btn1" class="btn1" type="submit">Convert</button>
            </form>

            <div id="result" aria-live="polite">Your converted amount will appear here.</div>
        </div>

        <script src="script3.js"></script>
    </body>
</html>
